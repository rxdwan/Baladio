name: Build & Release Baladio Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v3.0.0)'
        required: true
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
            build_cmd: npm run electron:build:win
          - os: macos-latest
            platform: mac
            build_cmd: npm run electron:build:mac
          - os: ubuntu-latest
            platform: linux
            build_cmd: npm run electron:build:linux

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Set up Python (for native module compilation)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install setuptools (provides distutils for node-gyp)
        run: pip install setuptools

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libfuse2 desktop-file-utils

      - name: Install dependencies
        run: npm ci

      - name: Stamp build with commit SHA
        run: |
          echo '{"commitSha":"${{ github.sha }}"}' > public/build-info.json

      - name: Compile & package Baladio
        run: ${{ matrix.build_cmd }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Baladio-${{ matrix.platform }}
          path: |
            dist-electron/*.exe
            dist-electron/*.dmg
            dist-electron/*.deb
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: |
            release-artifacts/*.exe
            release-artifacts/*.dmg
            release-artifacts/*.deb
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}