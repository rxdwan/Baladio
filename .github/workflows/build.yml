name: Build & Release Baladio Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v3.0.0)'
        required: true
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
            build_cmd: npm run electron:build:win
          - os: macos-latest
            platform: mac
            build_cmd: npm run electron:build:mac
          - os: ubuntu-latest
            platform: linux
            build_cmd: npm run electron:build:linux

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Set up Python (for native module compilation)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install setuptools (provides distutils for node-gyp)
        run: pip install setuptools

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libfuse2 desktop-file-utils

      - name: Install dependencies
        run: npm ci

      - name: Stamp build with commit SHA
        run: |
          echo '{"commitSha":"${{ github.sha }}"}' > public/build-info.json

      - name: Compile & package Baladio
        run: ${{ matrix.build_cmd }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Baladio-${{ matrix.platform }}
          path: |
            dist-electron/*.exe
            dist-electron/*.dmg
            dist-electron/*.deb
          if-no-files-found: warn

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Build Manifest & Checksums
        run: |
          cd release-artifacts
          sha256sum *.exe *.dmg *.deb 2>/dev/null > SHA256SUMS.txt || true
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const path = require("path");
            const dir = ".";
            const files = fs.readdirSync(dir);
            const platforms = {};
            files.forEach(f => {
              const ext = path.extname(f).toLowerCase();
              if ([".exe", ".dmg", ".deb", ".appimage"].includes(ext)) {
                const fullPath = path.join(dir, f);
                const buf = fs.readFileSync(fullPath);
                const hash = crypto.createHash("sha256").update(buf).digest("hex");
                let osKey = "other";
                if (ext === ".exe") osKey = "win";
                else if (ext === ".dmg") osKey = "mac";
                else if (ext === ".deb" || ext === ".appimage") osKey = "linux";
                platforms[osKey] = { name: f, sha256: hash, size: buf.length };
              }
            });
            const manifest = {
              version: "${{ inputs.tag_name || github.ref_name }}".replace(/^v/, ""),
              tagName: "${{ inputs.tag_name || github.ref_name }}",
              commitSha: "${{ github.sha }}",
              builtAt: new Date().toISOString(),
              platforms
            };
            fs.writeFileSync("build-manifest.json", JSON.stringify(manifest, null, 2));
            console.log("Generated build-manifest.json:", JSON.stringify(manifest, null, 2));
          '

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: |
            release-artifacts/*.exe
            release-artifacts/*.dmg
            release-artifacts/*.deb
            release-artifacts/build-manifest.json
            release-artifacts/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}